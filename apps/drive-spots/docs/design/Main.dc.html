<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ドライブスポット帳</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E1013}
a{color:#FF7A1A}a:hover{color:#FFA25C}
button{font-family:inherit;cursor:pointer}
.fld{width:100%;box-sizing:border-box;background:#171A1F;border:1px solid #2A2F37;border-radius:12px;color:#F2F3F5;font-family:inherit;font-size:16px;padding:12px 14px;outline:none}
.fld:focus{border-color:#FF7A1A}
.fld::placeholder{color:#7D8490}
.scroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E1013; color: #F2F3F5; font-family: 'Zen Kaku Gothic New', sans-serif; position: relative; overflow: hidden; display: flex; flex-direction: column">

<!-- ===== 一覧 ===== -->
<sc-if value="{{isList}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; height: 844px">
  <div style="padding: 52px 20px 14px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 0.18em; color: {{accent}}">DRIVE LIST</div>
      <h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 0.02em">行きたい道ノート</h1>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; background: #171A1F; border-radius: 14px; padding: 4px">
      <sc-if value="{{tabWant}}" hint-placeholder-val="{{ true }}">
        <button type="button" onClick="{{showWant}}" style="border: 0; border-radius: 11px; background: {{accent}}; color: #0E1013; padding: 10px 0; font-size: 15px; font-weight: 700; display: flex; justify-content: center; align-items: baseline; gap: 6px">行きたい<span style="font-family: 'Barlow Condensed', sans-serif; font-size: 18px">{{wantCount}}</span></button>
        <button type="button" onClick="{{showDone}}" style="border: 0; border-radius: 11px; background: transparent; color: #A3A9B3; padding: 10px 0; font-size: 15px; font-weight: 500; display: flex; justify-content: center; align-items: baseline; gap: 6px">行った<span style="font-family: 'Barlow Condensed', sans-serif; font-size: 18px">{{doneCount}}</span></button>
      </sc-if>
      <sc-if value="{{tabDone}}" hint-placeholder-val="{{ false }}">
        <button type="button" onClick="{{showWant}}" style="border: 0; border-radius: 11px; background: transparent; color: #A3A9B3; padding: 10px 0; font-size: 15px; font-weight: 500; display: flex; justify-content: center; align-items: baseline; gap: 6px">行きたい<span style="font-family: 'Barlow Condensed', sans-serif; font-size: 18px">{{wantCount}}</span></button>
        <button type="button" onClick="{{showDone}}" style="border: 0; border-radius: 11px; background: #5AA9FF; color: #0E1013; padding: 10px 0; font-size: 15px; font-weight: 700; display: flex; justify-content: center; align-items: baseline; gap: 6px">行った<span style="font-family: 'Barlow Condensed', sans-serif; font-size: 18px">{{doneCount}}</span></button>
      </sc-if>
    </div>
  </div>

  <div class="scroll" style="display: flex; gap: 8px; overflow-x: auto; padding: 0 20px 14px; flex-shrink: 0">
    <sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
      <sc-if value="{{c.on}}" hint-placeholder-val="{{ false }}">
        <button type="button" onClick="{{c.pick}}" style="flex-shrink: 0; border: 1px solid #F2F3F5; background: #F2F3F5; color: #0E1013; border-radius: 999px; padding: 0 16px; height: 36px; font-size: 14px; font-weight: 700">{{c.label}}</button>
      </sc-if>
      <sc-if value="{{c.off}}" hint-placeholder-val="{{ true }}">
        <button type="button" onClick="{{c.pick}}" style="flex-shrink: 0; border: 1px solid #2E333B; background: transparent; color: #C9CDD4; border-radius: 999px; padding: 0 16px; height: 36px; font-size: 14px; font-weight: 500">{{c.label}}</button>
      </sc-if>
    </sc-for>
  </div>

  <div class="scroll" style="flex: 1; overflow-y: auto; padding: 0 20px 120px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{visible}}" as="s" hint-placeholder-count="6">
      <button type="button" onClick="{{s.open}}" style="width: 100%; text-align: left; border: 1px solid #22262D; background: #171A1F; color: #F2F3F5; border-radius: 16px; padding: 14px; display: flex; align-items: center; gap: 14px; flex-shrink: 0">
        <div style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px; background: #23272E; color: {{accent}}; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700">{{s.mark}}</div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
          <div style="font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.name}}</div>
          <div style="font-size: 13px; color: #A3A9B3">{{s.region}}・{{s.cat}}</div>
        </div>
        <sc-if value="{{s.done}}" hint-placeholder-val="{{ false }}">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5AA9FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
        </sc-if>
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E6570" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
    </sc-for>
    <sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}">
      <div style="padding: 48px 12px; text-align: center; color: #A3A9B3; display: flex; flex-direction: column; gap: 8px; align-items: center">
        <svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#5E6570" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19c3-1 4-5 8-7s5-6 8-7"></path><circle cx="4" cy="19" r="1.5"></circle><circle cx="20" cy="5" r="1.5"></circle></svg>
        <div style="font-size: 15px; font-weight: 700; color: #F2F3F5">まだありません</div>
        <div style="font-size: 13px; line-height: 1.6">行ったスポットは、詳細画面の<br>「行った！」ボタンでここに移ります</div>
      </div>
    </sc-if>
  </div>

  <button type="button" onClick="{{openAdd}}" style="position: absolute; right: 20px; bottom: 32px; height: 56px; padding: 0 22px 0 18px; border: 0; border-radius: 999px; background: {{accent}}; color: #0E1013; font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.45)">
    <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E1013" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
    スポットを追加
  </button>
</div>
</sc-if>

<!-- ===== 詳細 ===== -->
<sc-if value="{{isDetail}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; height: 844px">
  <div style="padding: 48px 12px 8px; display: flex; align-items: center">
    <button type="button" onClick="{{goList}}" aria-label="一覧にもどる" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; border-radius: 12px">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F2F3F5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
    </button>
  </div>
  <div class="scroll" style="flex: 1; overflow-y: auto; padding: 4px 20px 32px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; gap: 8px; align-items: center">
        <span style="font-size: 13px; font-weight: 700; color: #0E1013; background: {{accent}}; border-radius: 999px; padding: 4px 12px">{{sel.cat}}</span>
        <sc-if value="{{sel.done}}" hint-placeholder-val="{{ false }}">
          <span style="font-size: 13px; font-weight: 700; color: #0E1013; background: #5AA9FF; border-radius: 999px; padding: 4px 12px">行った</span>
        </sc-if>
      </div>
      <h1 style="margin: 0; font-size: 30px; line-height: 1.3; font-weight: 700">{{sel.name}}</h1>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="background: #171A1F; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 6px">
        <div style="font-size: 12px; color: #A3A9B3">地域</div>
        <div style="font-size: 16px; font-weight: 700">{{sel.region}}</div>
      </div>
      <div style="background: #171A1F; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 6px">
        <div style="font-size: 12px; color: #A3A9B3">自宅からの距離（片道）</div>
        <div style="font-size: 16px; font-weight: 700">{{sel.distText}}</div>
      </div>
      <div style="grid-column: span 2; background: #171A1F; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 6px">
        <div style="font-size: 12px; color: #A3A9B3">おすすめ時期</div>
        <div style="font-size: 16px; font-weight: 700">{{sel.seasonText}}</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 13px; color: #A3A9B3; font-weight: 500">メモ</div>
      <div style="background: #171A1F; border-radius: 14px; padding: 16px; font-size: 15px; line-height: 1.7; white-space: pre-line; color: #E2E4E8; min-height: 72px">{{sel.memoText}}</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: auto">
      <sc-if value="{{sel.want}}" hint-placeholder-val="{{ true }}">
        <button type="button" onClick="{{toggleDone}}" style="height: 56px; border: 0; border-radius: 16px; background: #5AA9FF; color: #0E1013; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E1013" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
          行った！にする
        </button>
      </sc-if>
      <sc-if value="{{sel.done}}" hint-placeholder-val="{{ false }}">
        <button type="button" onClick="{{toggleDone}}" style="height: 56px; border: 1px solid #2E333B; border-radius: 16px; background: transparent; color: #F2F3F5; font-size: 16px; font-weight: 700">「行きたい」に戻す</button>
      </sc-if>
      <button type="button" onClick="{{removeSel}}" style="height: 48px; border: 0; background: transparent; color: #FF8A80; font-size: 15px; font-weight: 500">このスポットを削除</button>
    </div>
  </div>
</div>
</sc-if>

<!-- ===== 追加 ===== -->
<sc-if value="{{isAdd}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; height: 844px">
  <div style="padding: 48px 12px 8px; display: grid; grid-template-columns: 96px 1fr 96px; align-items: center">
    <button type="button" onClick="{{goList}}" style="height: 44px; border: 0; background: transparent; color: #C9CDD4; font-size: 15px; text-align: left; padding-left: 8px">キャンセル</button>
    <div style="text-align: center; font-size: 17px; font-weight: 700">スポットを追加</div>
    <button type="button" onClick="{{save}}" style="height: 44px; border: 0; background: transparent; color: {{accent}}; font-size: 15px; font-weight: 700; text-align: right; padding-right: 8px">保存</button>
  </div>
  <div class="scroll" style="flex: 1; overflow-y: auto; padding: 12px 20px 40px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="f-name" style="font-size: 13px; color: #A3A9B3; font-weight: 500">スポット名（必須）</label>
      <input id="f-name" class="fld" type="text" placeholder="例：ヤビツ峠" value="{{form.name}}" onChange="{{onName}}">
      <sc-if value="{{nameError}}" hint-placeholder-val="{{ false }}">
        <div style="font-size: 13px; color: #FF8A80">スポット名を入れてください</div>
      </sc-if>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 13px; color: #A3A9B3; font-weight: 500">種類</div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{formCats}}" as="c" hint-placeholder-count="5">
          <sc-if value="{{c.on}}" hint-placeholder-val="{{ false }}">
            <button type="button" onClick="{{c.pick}}" style="border: 1px solid {{accent}}; background: {{accent}}; color: #0E1013; border-radius: 999px; padding: 0 16px; height: 40px; font-size: 14px; font-weight: 700">{{c.label}}</button>
          </sc-if>
          <sc-if value="{{c.off}}" hint-placeholder-val="{{ true }}">
            <button type="button" onClick="{{c.pick}}" style="border: 1px solid #2E333B; background: transparent; color: #C9CDD4; border-radius: 999px; padding: 0 16px; height: 40px; font-size: 14px; font-weight: 500">{{c.label}}</button>
          </sc-if>
        </sc-for>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="f-region" style="font-size: 13px; color: #A3A9B3; font-weight: 500">地域</label>
        <input id="f-region" class="fld" type="text" placeholder="例：神奈川" value="{{form.region}}" onChange="{{onRegion}}">
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="f-dist" style="font-size: 13px; color: #A3A9B3; font-weight: 500">片道の距離（km）</label>
        <input id="f-dist" class="fld" type="number" inputmode="numeric" placeholder="例：60" value="{{form.dist}}" onChange="{{onDist}}">
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="f-season" style="font-size: 13px; color: #A3A9B3; font-weight: 500">おすすめ時期</label>
      <input id="f-season" class="fld" type="text" placeholder="例：紅葉の季節、早朝" value="{{form.season}}" onChange="{{onSeason}}">
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="f-memo" style="font-size: 13px; color: #A3A9B3; font-weight: 500">メモ</label>
      <textarea id="f-memo" class="fld" rows="4" placeholder="例：冬は通行止め。帰りに寄りたいお店など" value="{{form.memo}}" onChange="{{onMemo}}" style="resize: none; line-height: 1.6"></textarea>
    </div>

    <button type="button" onClick="{{save}}" style="height: 56px; border: 0; border-radius: 16px; background: {{accent}}; color: #0E1013; font-size: 17px; font-weight: 700">保存する</button>
  </div>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF7A1A","options":["#FF7A1A","#FFC93C","#3CC8B4","#FF5C7A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    var seed = [
      ['ヤビツ峠', '神奈川', '峠', '', '峠のホームコースにしたい'],
      ['箱根ターンパイク', '神奈川', '絶景ロード', '', ''],
      ['箱根スカイライン', '静岡・神奈川', '絶景ロード', '', ''],
      ['富士スピードウェイ', '静岡', 'サーキット', '', ''],
      ['伊豆スカイライン', '静岡', '絶景ロード', '', ''],
      ['西伊豆スカイライン', '静岡', '絶景ロード', '', ''],
      ['奥多摩', '東京', '峠', '', ''],
      ['首都高（都心環状線）', '東京', '都市高速', '', ''],
      ['赤城山', '群馬', '峠', '', ''],
      ['榛名山', '群馬', '峠', '', ''],
      ['碓氷峠', '群馬・長野', '峠', '', ''],
      ['志賀草津高原ルート', '群馬・長野', '絶景ロード', '', '冬は通行止めの期間あり。行く前に通れるか確認'],
      ['ビーナスライン', '長野', '絶景ロード', '', ''],
      ['いろは坂', '栃木', '峠', '', ''],
      ['中禅寺湖スカイライン', '栃木', '絶景ロード', '', ''],
      ['筑波パープルライン', '茨城', '絶景ロード', '', ''],
      ['銚子ドーバーライン', '千葉', '海沿い', '', ''],
      ['九十九里浜', '千葉', '海沿い', '', ''],
      ['伊吹山ドライブウェイ', '岐阜・滋賀', '絶景ロード', '', '']
    ];
    var spots = seed.map(function (r, i) {
      return { id: i + 1, name: r[0], region: r[1], cat: r[2], season: r[3], memo: r[4], dist: '', done: false };
    });
    this.state = {
      spots: spots, nextId: spots.length + 1,
      screen: 'list', tab: 'want', cat: 'すべて', selId: null,
      form: this.blankForm(), nameError: false
    };
  }

  blankForm() {
    return { name: '', region: '', cat: '峠', dist: '', season: '', memo: '' };
  }

  setForm(key, value) {
    var f = Object.assign({}, this.state.form);
    f[key] = value;
    this.setState({ form: f, nameError: key === 'name' ? false : this.state.nameError });
  }

  renderVals() {
    var self = this;
    var st = this.state;
    var accent = this.props.accent ?? '#FF7A1A';
    var cats = ['峠', '絶景ロード', '海沿い', 'サーキット', '都市高速'];
    var marks = { '峠': '峠', '絶景ロード': '景', '海沿い': '海', 'サーキット': '走', '都市高速': '高' };

    var wantCount = st.spots.filter(function (s) { return !s.done; }).length;
    var doneCount = st.spots.length - wantCount;

    var visible = st.spots
      .filter(function (s) { return st.tab === 'done' ? s.done : !s.done; })
      .filter(function (s) { return st.cat === 'すべて' || s.cat === st.cat; })
      .map(function (s) {
        return Object.assign({}, s, {
          mark: marks[s.cat] || s.cat.charAt(0),
          open: function () { self.setState({ screen: 'detail', selId: s.id }); }
        });
      });

    var chips = ['すべて'].concat(cats).map(function (c) {
      return { label: c, on: st.cat === c, off: st.cat !== c, pick: function () { self.setState({ cat: c }); } };
    });

    var formCats = cats.map(function (c) {
      return { label: c, on: st.form.cat === c, off: st.form.cat !== c, pick: function () { self.setForm('cat', c); } };
    });

    var found = st.spots.find(function (s) { return s.id === st.selId; });
    var sel = found ? Object.assign({}, found, {
      want: !found.done,
      distText: found.dist ? '約 ' + found.dist + ' km' : '未入力',
      seasonText: found.season || '未入力',
      memoText: found.memo || 'メモはまだありません'
    }) : { name: '', cat: '', region: '', distText: '', seasonText: '', memoText: '', want: true, done: false };

    return {
      accent: accent,
      isList: st.screen === 'list', isDetail: st.screen === 'detail', isAdd: st.screen === 'add',
      tabWant: st.tab === 'want', tabDone: st.tab === 'done',
      wantCount: wantCount, doneCount: doneCount,
      chips: chips, visible: visible, isEmpty: visible.length === 0,
      sel: sel, form: st.form, formCats: formCats, nameError: st.nameError,
      showWant: function () { self.setState({ tab: 'want' }); },
      showDone: function () { self.setState({ tab: 'done' }); },
      goList: function () { self.setState({ screen: 'list', nameError: false }); },
      openAdd: function () { self.setState({ screen: 'add', form: self.blankForm(), nameError: false }); },
      toggleDone: function () {
        self.setState({ spots: st.spots.map(function (s) { return s.id === st.selId ? Object.assign({}, s, { done: !s.done }) : s; }) });
      },
      removeSel: function () {
        self.setState({ spots: st.spots.filter(function (s) { return s.id !== st.selId; }), screen: 'list', selId: null });
      },
      onName: function (e) { self.setForm('name', e.target.value); },
      onRegion: function (e) { self.setForm('region', e.target.value); },
      onDist: function (e) { self.setForm('dist', e.target.value); },
      onSeason: function (e) { self.setForm('season', e.target.value); },
      onMemo: function (e) { self.setForm('memo', e.target.value); },
      save: function () {
        var f = st.form;
        if (!f.name.trim()) { self.setState({ nameError: true }); return; }
        var spot = { id: st.nextId, name: f.name.trim(), region: f.region.trim() || '未入力', cat: f.cat, dist: f.dist, season: f.season.trim(), memo: f.memo.trim(), done: false };
        self.setState({ spots: [spot].concat(st.spots), nextId: st.nextId + 1, screen: 'list', tab: 'want', cat: 'すべて', form: self.blankForm() });
      }
    };
  }
}
</script>
</body>
</html>
