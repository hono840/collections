<!doctype html>
<html lang="ja">
  <body style="font-family: sans-serif; line-height: 1.7; color: #1a1a1a;">
    <h2>公道レビュー ログイン</h2>
    <p>下のボタンを押すとログインできます。</p>
    <p>
      <a
        href="{{ .RedirectTo }}/auth/confirm?token_hash={{ .TokenHash }}&type=email"
        style="display: inline-block; padding: 10px 20px; background: #1b2a4a; color: #ffffff; text-decoration: none; border-radius: 4px;"
        >ログインする</a
      >
    </p>
    <p>または、ログイン画面に次の6桁のコードを入力してください。</p>
    <p style="font-size: 28px; font-weight: bold; letter-spacing: 6px;">{{ .Token }}</p>
    <p style="color: #555555; font-size: 13px;">
      このリンクとコードは1時間で使えなくなります。<br />
      心当たりがない場合は、このメールを無視してください。
    </p>
  </body>
</html>
